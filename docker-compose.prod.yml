version: '3.8'

# Конфигурация для продакшена
# Использование: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    # В продакшене добавляем migrate и убираем volume монтирование
    entrypoint: sh -c "python manage.py migrate && python manage.py collectstatic --no-input && gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --worker-class sync --timeout 30 --max-requests 1000 --max-requests-jitter 50"
    restart: unless-stopped
    # В продакшене НЕ монтируем ./backend:/app для лучшей производительности
    # Код берется из образа, собранного при docker build
    volumes:
      - backend_static:/app/staticfiles
      # Убрано: - ./backend:/app (для производительности)

  frontend:
    # В продакшене используем оптимизированную сборку
    build:
      dockerfile: Dockerfile
      # Можно добавить build args для оптимизации
      # args:
      #   - NODE_ENV=production
