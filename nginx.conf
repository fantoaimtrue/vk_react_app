server {
    listen 80;
    server_name bodyexp.ru www.bodyexp.ru;

    # Обработка запросов для верификации домена Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Перенаправление всех остальных HTTP запросов на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bodyexp.ru www.bodyexp.ru;

    # SSL сертификаты (путь взят из ваших старых конфигов)
    ssl_certificate /etc/letsencrypt/live/bodyexp.ru-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bodyexp.ru-0001/privkey.pem;

    # Корень сайта, где лежат собранные файлы фронтенда
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Раздача статических файлов Django (для админки)
    location /static/ {
        alias /var/www/static/;
    }

    # Проксирование запросов к API и админ-панели на бэкенд
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

