server {
    listen 80;
    server_name utkaminiapp.ru www.utkaminiapp.ru;

    # Обработка запросов для верификации домена Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    # Перенаправление всех остальных HTTP запросов на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Map для определения X-Frame-Options в зависимости от referer
map $http_referer $x_frame_options {
    default "SAMEORIGIN";
    "~^https?://(www\.)?(vk\.com|vk\.ru|m\.vk\.com|m\.vk\.ru)" "";
}

server {
    listen 443 ssl;
    http2 on;
    server_name utkaminiapp.ru www.utkaminiapp.ru;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/utkaminiapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/utkaminiapp.ru/privkey.pem;
    
    # Современные SSL настройки безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # OCSP Stapling (отключено, если сертификат не поддерживает)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Security headers
    # X-Frame-Options: не устанавливаем для VK доменов (vk.com, vk.ru) согласно документации
    # https://dev.vk.com/ru/mini-apps/getting-started
    add_header X-Frame-Options $x_frame_options always;
    # Content-Security-Policy для поддержки VK доменов
    add_header Content-Security-Policy "frame-ancestors 'self' https://vk.com https://vk.ru https://m.vk.com https://m.vk.ru" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Проксирование запросов к админ-панели на бэкенд
    location /admin {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        proxy_buffering off;
        proxy_cache off;
    }

    # Проксирование запросов к API на бэкенд
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Раздача статических файлов Django (для админки)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Корень сайта, где лежат собранные файлы фронтенда
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
