services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-babkimanki_db}
      POSTGRES_USER: ${DB_USER:-babkimanki_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - babkimanki_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - frontend_build:/usr/share/nginx/html
      - backend_static:/var/www/static
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - babkimanki_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w \"%{http_code}\" http://localhost/ | grep -qE \"200|301\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    entrypoint: sh -c "python manage.py collectstatic --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --worker-class sync --timeout 60 --max-requests 1000 --max-requests-jitter 50"
    env_file:
      - .env
    volumes:
      - backend_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - babkimanki_network
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/mfos/from-db/\")' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 600M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - frontend_build:/usr/share/nginx/html
    networks:
      - babkimanki_network
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
  
  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh"
    command: -c "sleep 10 && certbot certonly --webroot --webroot-path=/var/www/certbot --email admin@utkaminiapp.ru --agree-tos --no-eff-email --force-renewal -d utkaminiapp.ru -d www.utkaminiapp.ru"
    depends_on:
      nginx:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  frontend_build:
  backend_static:

networks:
  babkimanki_network:
    driver: bridge
