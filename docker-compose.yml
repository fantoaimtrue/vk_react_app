version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-babkimanki_db}
      POSTGRES_USER: ${DB_USER:-babkimanki_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - babkimanki_network
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - frontend_build:/usr/share/nginx/html
      - backend_static:/var/www/static
    depends_on:
      - backend
      - frontend
    networks:
      - babkimanki_network

  backend:
    build: 
      context: ./backend
    restart: unless-stopped
    entrypoint: sh -c "python manage.py collectstatic --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
    depends_on:
      - db
    networks:
      - babkimanki_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: sh -c "npm install && npm run build && cp -r dist/. /usr/share/nginx/html/"
    volumes:
      - frontend_build:/usr/share/nginx/html
    networks:
      - babkimanki_network
  
  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    command: >
      sh -c "sleep 10 && certbot certonly --webroot --webroot-path=/var/www/certbot --email admin@bodyexp.ru --agree-tos --no-eff-email --force-renewal -d bodyexp.ru -d www.bodyexp.ru"
    depends_on:
      - nginx

volumes:
  postgres_data:
  frontend_build:
  backend_static:

networks:
  babkimanki_network:
    driver: bridge
